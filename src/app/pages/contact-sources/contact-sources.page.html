<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Списки</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="store.addContactList()" aria-label="Добавить список">
        <ion-icon slot="icon-only" name="add-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="shell">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Списки</ion-title>
    </ion-toolbar>
  </ion-header>

  <app-page-inset>
    <ion-accordion-group class="sources-accordion" [multiple]="true" [value]="[store.activeDataSource]">
      @for (group of store.groupedContactSources(); track group.source) {
        <ion-accordion [value]="group.source">
          <ion-item slot="header" lines="none" button detail="false" class="sources-accordion__header">
            <ion-label>{{ group.source }}</ion-label>
          </ion-item>

          <div slot="content" class="sources-panel">
            @for (list of group.lists; track list.id) {
              <a
                class="sources-row"
                [class.active]="store.activeContactListId === list.id"
                [routerLink]="['/tabs/contact/list']"
                (click)="store.setActiveContactList(list.id)"
              >
                <span class="sources-row__title">{{ list.title }}</span>
                <span class="sources-row__count">{{ store.contactListCount(list.id) }}</span>
                <ion-icon name="chevron-forward-outline"></ion-icon>
              </a>
            }
          </div>
        </ion-accordion>
      }
    </ion-accordion-group>
  </app-page-inset>
</ion-content>
