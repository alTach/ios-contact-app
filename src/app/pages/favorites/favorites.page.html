<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button text="" defaultHref="/tabs/contact/list"></ion-back-button>
    </ion-buttons>
    <ion-title>Избранные</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="shell">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Избранные</ion-title>
    </ion-toolbar>
  </ion-header>

  <app-page-inset>
    <app-contacts-tab-view tab="favorites" viewMode="extended" [showToolbar]="false"></app-contacts-tab-view>
  </app-page-inset>
</ion-content>
