<div class="ion-page">
  <ion-header [translucent]="true">
    <ion-toolbar>
      <ion-buttons slot="start">
        <ion-back-button defaultHref="/tabs/contact/list" text=""></ion-back-button>
      </ion-buttons>
      <ion-title>Настройки</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content [fullscreen]="true" class="settings-shell">
    <app-page-inset>
      <section class="settings-layout">
        <section class="settings-card">
          <section class="settings-section">
            <p class="eyebrow">1. Синхронизация</p>
            <div class="settings-list">
              @for (provider of syncProviders; track provider.title) {
                <article class="settings-item">
                  <div>
                    <h3>{{ provider.title }}</h3>
                    <p>{{ provider.description }}</p>
                  </div>
                  <ion-toggle [checked]="provider.enabled"></ion-toggle>
                </article>
              }
            </div>
          </section>

          <section class="settings-section">
            <p class="eyebrow">Кого синхронизировать</p>
            <div class="chip-row">
              @for (scope of syncScopes; track scope) {
                <span class="chip-button static">{{ scope }}</span>
              }
            </div>
          </section>

          <section class="settings-section">
            <p class="eyebrow">Экспорт</p>
            <div class="chip-row">
              @for (option of exportOptions; track option) {
                <span class="chip-button static">{{ option }}</span>
              }
            </div>
          </section>
        </section>
      </section>
    </app-page-inset>
  </ion-content>
</div>
